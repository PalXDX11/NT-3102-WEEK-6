<!doctype html>
<html lang="en">
<head>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>My Anime</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #0b0b12;
      color: white;
      font-family: "Roboto", sans-serif;
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 10;
    }

    /* HOME */
    #home {
      min-height: 100vh;
      background: url("waaah.jpeg") center / contain no-repeat;
      background-color: #cccece;
      display: grid;
      place-items: center;
      text-align: center;
      padding-top: 60px;
    }

    .welcome {
      background: #0009;
      padding: 35px;
      border-radius: 15px;
    }

    /* ANIME SECTION */
    #anime {
      min-height: 100vh;
      padding: 100px 30px 50px;
      background: linear-gradient(135deg, #09090f, #1b102b);
    }

    /* ANIME CARD */
    .anime-card {
      background: #171722;
      border: 1px solid #29293a;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
      height: 100%;
    }

    .anime-card:hover {
      transform: translateY(-8px);
      border-color: #8b5cf6;
    }

    .anime-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .info {
      padding: 15px;
    }

    .rating {
      color: #ffc107;
    }

    /* WATCH BUTTON */
    .watch {
      width: 100%;
      border: 0;
      padding: 9px;
      border-radius: 6px;
      background: #8b5cf6;
      color: white;
      transition: 0.2s;
    }

    .watch:hover {
      background: #7c3aed;
    }

    
    .search-box {
      border: 1px solid #29293a;
    }

    .search-box:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
    }
  </style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar navbar-dark bg-dark">
  <div class="container">

    <a class="navbar-brand fw-bold" href="#home">
      <i class="fa-solid fa-tv"></i>
      My Anime
    </a>

    <div>
      <a class="btn btn-dark" href="#home">
        <i class="fa-solid fa-house"></i>
        Home
      </a>

      <a class="btn btn-dark" href="#anime">
        <i class="fa-solid fa-film"></i>
        Anime
      </a>
    </div>

  </div>
</nav>


<!-- =========================
     PAGE 1 - HOME
========================= -->

<section id="home">

  <div class="welcome">

    <h1>
      <i class="fa-solid fa-star"></i>
      Welcome!
    </h1>

    <p>Welcome to my anime website.</p>

    <a href="#anime" class="btn btn-light">
      <i class="fa-solid fa-play"></i>
      Browse Anime
    </a>

  </div>

</section>




<section id="anime">

  <div class="container">

    <h2 class="fw-bold">
      <i class="fa-solid fa-book-open"></i>
      Anime Library
    </h2>

    <p class="text-secondary">
      Choose something to watch.
    </p>


    <!-- SEARCH BOX -->

    <div class="input-group mb-4">

      <span class="input-group-text bg-dark text-white border-secondary">
        <i class="fa-solid fa-magnifying-glass"></i>
      </span>

      <input
        type="text"
        class="form-control bg-dark text-white search-box"
        placeholder="Search anime..."
      >

    </div>




    <div class="row g-4">

      <script>

        const anime = [

          [
            "Naruto",
            "https://media1.tenor.com/m/pKz5b3__6n0AAAAd/naruto-sasuke-kiss-sasuke-naruto-kiss.gif",
            "8.8",
            "Action • Adventure"
          ],

          [
            "One Piece",
            "https://media.tenor.com/hOA-3J5QyFQAAAAC/luffy-one-piece.gif",
            "9.0",
            "Action • Adventure"
          ],

          [
            "Demon Slayer",
            "https://gifdb.com/images/thumbnail/muzan-498-x-278-gif-kl2tvcd6oe09himt.gif",
            "8.7",
            "Action • Fantasy"
          ],

          [
            "Jujutsu Kaisen",
            "https://media.tenor.com/3l8ei9EsCvEAAAAM/sukuna-is-a-goober.gif",
            "8.6",
            "Action • Fantasy"
          ],

          [
            "Attack on Titan",
            "https://media.tenor.com/wsqaA7hppHUAAAAM/titan.gif",
            "9.1",
            "Action • Drama"
          ],

          [
            "My Hero Academia",
            "https://media1.tenor.com/m/q4VS37WZM-EAAAAC/mha-memes.gif",
            "8.2",
            "Action • Shounen"
          ],

          [
            "Your Name",
            "https://www.icegif.com/wp-content/uploads/2024/07/your-name-icegif-9.gif",
            "8.8",
            "Romance • Drama"
          ],

          [
            "Spy x Family",
            "https://media.tenor.com/S7t3Y-cP4isAAAAd/spy-x-family-anya.gif",
            "8.5",
            "Comedy • Action"
          ]

        ];


        document.write(

          anime.map(a => `

            <div class="col-12 col-sm-6 col-lg-3">

              <div class="anime-card">

                <img
                  src="${a[1]}"
                  alt="${a[0]}"
                >

                <div class="info">

                  <h5>
                    ${a[0]}
                  </h5>

                  <div class="rating">
                    <i class="fa-solid fa-star"></i>
                    ${a[2]}
                  </div>

                  <p class="text-secondary">
                    ${a[3]}
                  </p>

                  <button class="watch">
                    <i class="fa-solid fa-play"></i>
                    Watch Now
                  </button>

                </div>

              </div>

            </div>

          `).join("")

        );

      </script>

    </div>

  </div>

</section>


</body>
</html>
