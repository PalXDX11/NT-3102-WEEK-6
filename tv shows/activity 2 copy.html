<!DOCTYPE html>
<html>
<head>
    <style>
        /* Whole Website Background  */

        body {
            margin: 0;
            min-height: 100vh;
            background-color: darkblue
        }

        /* Main Table Styling */
     
        table {
            border-collapse: collapse;
            width: 900px;
            margin: 0 auto;
            border: 3px solid black;
            background-color: white;
            table-layout: fixed;
        }

        td, th {
            border: 1px solid black;
            text-align: center;
            vertical-align: middle;
            padding: 0;
        }

        /* Forces standard images to fit the images into the box */
        td img, .collage-grid img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Top Title Header Styling */
        .header {
            color: white;
            font-size: 26px;
            font-family: sans-serif;
            padding: 18px;
            background-color: #1a1a2e;
        }

        /* Main Row Height */
        .row-main td { 
            height: 345px; 
        }

        /* Bottom Row Height */
        .row-bottom td { 
            height: 320px; 
            max-height: 320px;
        }

        /* this is for the tallest table (A7) */
        .tall-poster-cell {
            position: relative;
        }

        .tall-poster-cell img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Fixed Collage Container under slamdunk */
        .collage-container {
            width: 100%;
            height: 320px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 64px); /* 5 equal rows strictly totaling 320px */
            width: 100%;
            height: 100%;
        }

        .collage-grid div {
            border: 1px solid black;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 2 medium sized table under slamdunk*/
        .span-tall-right { grid-column: span 2; grid-row: span 2; }
        .span-tall-left  { grid-column: span 2; grid-row: span 2; }

        /* Nested 2x2 Grid Table Styling under Tom & Jerry */
        .grid-container {
            padding: 0;
            vertical-align: top;
            height: 320px;
        }

        .nested-grid {
            width: 100%;
            height: 320px;
            border-collapse: collapse;
            border: none;
            table-layout: fixed;
        }

        .nested-grid td {
            width: 50%;
            height: 160px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

<table>
    <!-- Title Row -->
    <tr>
        <th colspan="4" class="header"><b>| MY CHILDHOOD SERIES |</b></th>
    </tr>

    <!-- First poster row containing four main posters -->
    <tr class="row-main">
        <td>
          <a href="https://myanimelist.net/anime/2471/Doraemon_1979" target="_blank">
            <img src="doraemon.jpeg" alt="A1">
          </a>
        </td>
        <td>
          <a href="https://www.justwatch.com/us/tv-show/ben-10" target="_blank">
            <img src="ben 10.jpeg" alt="A2">
          </a>
        </td>
        <td>
          <a href="https://www.justwatch.com/us/tv-show/jackie-chan-adventures" target="_blank">
            <img src="jackie chan.jpeg" alt="A3">
          </a>
        </td>
        <td>
          <a href="https://www.justwatch.com/us/tv-show/spongebob-squarepants" target="_blank">
            <img src="Watch spongebob.jpeg" alt="A4">
          </a>
        </td>
    </tr>

    <!-- Second poster row. -->
    <tr class="row-main">
        <td>
          <a href="https://myanimelist.net/anime/170/Slam_Dunk" target="_blank">
            <img src="slam dunk.jpeg" alt="A5">
          </a>
        </td>
        <td>
          <a href="https://www.justwatch.com/us/tv-show/tom-and-jerry" target="_blank">
            <img src="tom and jeery.jpeg" alt="A6">
          </a>
        </td>

     <!-- colspan="2" makes this cell 2 columns wide.
         rowspan="2" makes it 2 rows tall -->    
        <td colspan="2" rowspan="2" class="tall-poster-cell"><img src="dragonball z.jpeg" alt="A7"></td>
    </tr>
 
    <!-- Bottom row containing the collage and the 2x2 image grid -->
    <tr class="row-bottom">
        
        <!-- Holds the 4-column cartoon collage below Slam Dunk -->
        <td class="collage-container">
            <div class="collage-grid">
                <!-- First section of the collage -->
                <div><img src="popeye.jpeg" alt="A8"></div>
                <div><img src="dexter.jpeg" alt="A9"></div>
                
                <!-- This image spans 2 columns and 2 rows -->
                <div class="span-tall-right"><img src="fairy odd parents.jpeg" alt="A10 Tall"></div>
                <div><img src="Johnny Bravo (1997).jpeg" alt="A11"></div>
                <div><img src="jimmy neutron.jpeg" alt="A12"></div>

                <!-- Middle section of the collage -->
                <div><img src="go diego go.jpeg" alt="A13"></div>
                <div><img src="gno homo.jpeg" alt="A14"></div>
                <div><img src="Oggy and the Cockroaches.jpeg" alt="A15"></div>
                <div><img src="2000s cartoons.jpeg" alt="A16"></div>

                <!-- Final section. Bolt spans 2 columns and 2 rows -->
                <div class="span-tall-left"><img src="bolt.jpeg" alt="A17 Tall"></div>
                <div><img src="power rangers.jpeg" alt="A18"></div>
                <div><img src="kamen rider 000.webp" alt="A19"></div>
                <div><img src="Alvin and the Chipmunks (2007).jpeg" alt="A20"></div>
                <div><img src="Kick Buttowski (1).jpeg" alt="A21"></div>
            </div>
        </td>

        <!-- creates a nested table below tom and jerry that contains four images in 2x2 arrangement -->
        <td class="grid-container">
            <table class="nested-grid">
                <!-- first row of the 2x2 grid-->
                <tr>
                    <td><img src="megamind.jpeg" alt="A22"></td>
                    <td><img src="Turbo.jpeg" alt="A23"></td>
                </tr>

               <!-- second row of the 2x2 grid-->
                <tr>
                    <td><img src="stitch.jpeg" alt="A24"></td>
                    <td><img src="chicken little.jpeg" alt="A25"></td>
                </tr>
            </table>
        </td>

    </tr>
</table>

</body>
</html>
