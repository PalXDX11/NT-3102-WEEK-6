<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

    <div class="container">

        <form class="login-form" id="registerForm">

            <h1>Create Account</h1>

            <p>Register your new account</p>


            <!-- Full Name -->
            <label for="fullname">Full Name</label>

            <input
                type="text"
                id="fullname"
                placeholder="Enter your full name"
            >

            <div id="fullname-error" class="validation-message">
                Please enter your full name.
            </div>


            <!-- Email -->
            <label for="email">Email</label>

            <input
                type="text"
                id="email"
                placeholder="Enter your email"
            >

            <div id="email-error" class="validation-message">
                Please enter your email.
            </div>


            <!-- Password -->
            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
            >

            <div id="password-error" class="validation-message">
                Please enter your password.
            </div>


            <!-- Confirm Password -->
            <label for="confirm-password">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirm-password"
                placeholder="Confirm your password"
            >

            <div id="confirm-password-error" class="validation-message">
                Please confirm your password.
            </div>


            <button type="submit">
                Register
            </button>


            <p class="register-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </form>

    </div>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>

</html>
